name: publish-0.1.0

on:
  push:
    tags:
      - "0.1.0"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require the exact annotated release tag and authorized signatures
        run: |
          test "$GITHUB_REF" = "refs/tags/0.1.0"
          test "$(git cat-file -t refs/tags/0.1.0)" = "tag"
          printf '%s\n' 'modavis-project@users.noreply.github.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIC0hRn2syRAD3vCm9MLm766FprDF3GfVMVmj5C2wYPkk' > "$RUNNER_TEMP/modavis-allowed-signers"
          git -c gpg.ssh.allowedSignersFile="$RUNNER_TEMP/modavis-allowed-signers" verify-tag refs/tags/0.1.0
          MODAVIS_RELEASE_COMMIT="$(git rev-list -n 1 refs/tags/0.1.0)"
          test "$MODAVIS_RELEASE_COMMIT" = "$GITHUB_SHA"
          git -c gpg.ssh.allowedSignersFile="$RUNNER_TEMP/modavis-allowed-signers" verify-commit "$MODAVIS_RELEASE_COMMIT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install release dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends apache2
          python -m pip install --require-hashes -r requirements-dev.txt
          reuse lint
      - name: Build the immutable final release from the signed tag
        run: |
          python scripts/check_prepublication.py --publication-ready
          python scripts/check_w3id.py --require-apache
          python scripts/build_release_candidate.py --output-directory "$RUNNER_TEMP/modavis-release"
          python scripts/check_w3id.py --site "$RUNNER_TEMP/modavis-release/site" --require-apache
          cd "$RUNNER_TEMP/modavis-release"
          sha256sum --check modavis-ontology-0.1.0.zip.sha256
      - name: Create or update the durable GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view 0.1.0 >/dev/null 2>&1; then
            gh release upload 0.1.0 "$RUNNER_TEMP/modavis-release/modavis-ontology-0.1.0.zip" "$RUNNER_TEMP/modavis-release/modavis-ontology-0.1.0.zip.sha256" --clobber
          else
            gh release create 0.1.0 "$RUNNER_TEMP/modavis-release/modavis-ontology-0.1.0.zip" "$RUNNER_TEMP/modavis-release/modavis-ontology-0.1.0.zip.sha256" --verify-tag --title "MODAVIS Ontology Network 0.1.0" --notes "Immutable MODAVIS Ontology Network 0.1.0 release. The attached source-and-site archive is accompanied by its SHA-256 checksum. Contributor affiliations do not imply institutional endorsement."
          fi

  pages:
    needs: validate
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Build the verified publication site
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends apache2
          python -m pip install --require-hashes -r requirements-dev.txt
          python scripts/check_prepublication.py --publication-ready
          python scripts/check_w3id.py --require-apache
          python scripts/build_release_candidate.py --output-directory "$RUNNER_TEMP/modavis-release"
          python scripts/check_w3id.py --site "$RUNNER_TEMP/modavis-release/site" --require-apache
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/modavis-release/site
      - name: Deploy the verified site
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
